# =============================================================================
# tmux configuration
# =============================================================================
# Symlinked to ~/.tmux.conf by setup.sh, so edits here take effect on the next
# `prefix + r` with no re-run. Plugin refs below are pinned and rewritten from
# versions.lock by setup.sh — change versions there, not here.
# =============================================================================

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# Let nvim change the cursor shape and use undercurls for diagnostics.
set -ag terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ag terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Prefix
set -g prefix C-s
bind C-s send-prefix

# General
set -g mouse on
set -g mode-keys vi
set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on
set -g display-time 2000
# Renumber/aggressive-resize keep layouts sane when attaching from another client.
set -g aggressive-resize on

# Windows and panes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Pane navigation (shared with vim-tmux-navigator)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane resize — repeatable, so hold the key rather than re-pressing the prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r M resize-pane -Z          # maximise/restore this pane

# Splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Session / window management
bind S choose-tree -Zs            # fuzzy session switcher
bind X confirm-before -p "kill window #W? (y/n)" kill-window
bind -r n next-window
bind -r p previous-window

# Copy mode — vi bindings, and y copies to the system clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind Enter copy-mode

# Clipboard: pick the backend at runtime instead of at install time, so this
# file is identical on macOS and Linux and can therefore be symlinked.
# macOS has pbcopy natively; Linux uses the tmux-clipboard helper setup.sh
# writes, which resolves Wayland / X11 / OSC 52 on each invocation.
if-shell 'command -v pbcopy >/dev/null 2>&1' {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux-clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "tmux-clipboard"
}

# Popup windows — lazygit and a scratch shell without disturbing the layout.
# These mirror nvim's <leader>gg and <C-\> so the same tools are one key away
# whether or not nvim is currently focused.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind k display-popup -E -w 90% -h 90% "k9s"

# Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W *"

# Status bar
set-option -g status-position top
set -g status-left ""
set -g status-right-length 200
set -g status-right "#[fg=#cba6f7,bg=default] 󰍛 #{cpu_percentage} #[fg=#89dceb,bg=default] 󰘚 #{ram_percentage} #{E:@catppuccin_status_session}"
set -g status-style bg=default

# Plugins — refs pinned from versions.lock by setup.sh
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator#e41c431a0c7b7388ae7ba341f01a0d217eb3a432'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @plugin 'tmux-plugins/tmux-cpu#bcb110d754ab2417de824c464730c412a3eb2769'

# Initialize TMUX plugin manager (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
